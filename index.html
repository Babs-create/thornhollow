<!doctype html>
<html lang="en">
<head>

<title>Thornhollow Academy</title>

<style>
:root{
  --panel:rgba(244,238,222,.94);--ink:#22261F;--ink2:#5A6152;--line:#22261F;--btn:#E6E1D2;--btnh:#D8D2C0;--accent:#8A2D5A;--hp:#B8433A;--good:#3D7A3A;

}

*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%;margin:0}
body{background:#14161f;color:var(--ink);font-family:'Pixelify Sans',ui-monospace,Menlo,monospace;overflow:hidden;user-select:none;-webkit-user-select:none}

#room{display:none}#mm{cursor:pointer}#mm .hint{font-size:12px;text-align:center;margin-top:4px;color:var(--ink2)}

#sinfo{display:none;position:absolute;left:50%;bottom:86px;transform:translateX(-50%);padding:6px 12px;font-size:14px;line-height:1.4;text-align:center;width:max-content;max-width:min(600px,92vw);pointer-events:none}
#sinfo.show{display:block}#sinfo:empty{display:none}#sinfo b{font-weight:700}#sinfo .nx{color:var(--accent)}

#overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(10,12,20,.6);padding:16px}
#overlay.hide{display:none}
.card{max-width:520px;width:100%;padding:22px 24px;max-height:100%;overflow:auto}
.card h1{font-weight:700;font-size:36px;line-height:1.05;margin:0 0 10px}
.card h2{font-weight:700;font-size:26px;margin:0 0 8px}
.card p{font-size:16px;line-height:1.55;margin:0 0 12px}
.card .keys{font-size:14px;line-height:1.7;color:var(--ink2);margin:0 0 16px}
.card .keys b{color:var(--ink);font-weight:600}
.row{display:flex;gap:8px;flex-wrap:wrap}
button{font:inherit;font-size:16px;color:var(--ink);background:var(--btn);border:2px solid var(--line);padding:8px 16px;cursor:pointer}
button:hover{background:var(--btnh)}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button.primary{background:var(--accent);color:#fff}
.crest{font-size:38px;font-weight:700;text-align:center;margin:10px 0}
.book{height:110px;display:flex;align-items:center;justify-content:center;margin:6px 0 12px}
.book div{width:72px;height:96px;background:#6b2a1e;box-shadow:inset -8px 0 0 #4a1c14,4px 4px 0 #000;animation:flip .4s steps(2) infinite alternate}
@keyframes flip{to{transform:scaleX(.6)}}
#touch{display:none}
.coarse #touch{display:block}
#joy{position:absolute;left:18px;bottom:110px;width:120px;height:120px;border-radius:50%;background:rgba(255,255,255,.12);border:2px solid rgba(255,255,255,.35)}
#joy i{position:absolute;left:40px;top:40px;width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,.45)}
.tb{position:absolute;width:64px;height:64px;border-radius:50%;background:rgba(20,20,30,.6);border:2px solid rgba(255,255,255,.4);color:#fff;font-size:14px;padding:0}
#tcast{right:20px;bottom:120px;width:80px;height:80px;background:rgba(138,45,90,.8)}
#tuse{right:112px;bottom:110px}#tduel{right:30px;bottom:212px}
@media (max-width:760px){
  #board{top:auto;bottom:150px;transform:none;min-width:0;padding:6px 8px}.hrow{font-size:13px}#board h3,#cupline{display:none}
  #mm{width:130px;padding:5px}#mmc{width:116px;height:116px}#room{font-size:13px}
  #hud{max-width:52vw;padding:8px 10px}#clock{font-size:16px}#cls,#obj{font-size:12px}
  .slot{width:52px;height:46px;font-size:11px;padding:14px 2px 2px}
  #hp{width:150px;bottom:auto;top:150px;padding:6px 8px}
  #bar{bottom:8px}#sinfo{bottom:62px;font-size:12px;padding:4px 8px}
  .coarse #board{bottom:auto;top:200px}#prompt{bottom:120px}
}
</style>
</head>
<body>
<div id="app">
  <canvas id="game"></canvas>
  <div id="labels"></div>
  <div id="prompt" class="panel"></div>
  <div id="hud" class="panel"><div id="clock"></div><div id="cls"></div><div id="obj"></div><div id="pts" title="Show house standings"></div></div><div id="banner"><div class="t"></div><div class="s"></div></div><div id="doorlabels" style="position:absolute;inset:0;pointer-events:none;overflow:hidden"></div>

  <div id="bigmap"><canvas id="bmc" width="720" height="720"></canvas><div class="cap" id="bmcap">Full map. Press M or tap anywhere to close.</div></div><div id="fade"></div>
  <div id="overlay"><div class="card panel" id="card"><h2>Loading...</h2></div></div>
</div>
<script>
// ================= DATA =================
const SP=34;
const R={

cr_herons:{n:"Herons' roost",c:4,r:0,z:"common",house:"herons",d:"High windows, quiet corners, and a view over the sea."},
cr_foxes:{n:"Foxes' burrow",c:2,r:2,z:"common",house:"foxes",d:"Low lamps, warm rugs, and more hiding places than anyone admits."},
cr_bears:{n:"Bears' lodge",c:5,r:2,z:"common",house:"bears",d:"Heavy timber, a roaring fire, and a pantry nobody guards."},

thorn:{n:"Thornwood",c:6,r:6,z:"ground",d:"The edge of the dark forest. Students are told not to come here."},
hollow:{n:"Hollow oak",c:6,r:7,z:"ground",d:"An ancient oak, hollow as a cathedral, ringed with glowing mushrooms."}
};
const E=[["gate","foyer"],["gate","bridge"],["bridge","road"],["gate","garden"],["bridge","marsh"],["marsh","garden"],["garden","orchard"],["orchard","mill"],["mill","apoth"],["mill","stones"],["stones","moon"],["moon","tarn"],["foyer","court"],["foyer","kitchen"],["foyer","scrip"],["court","refect"],["court","lib"],["court","doors"],["refect","kitchen"],["lib","scrip"],["lib","yard"],["scrip","apoth"],["yard","apoth"],["doors","warden","seal"],["doors","clock"],["clock","bell"],["clock","vane"],["clock","star",null,1],["vane","light"],["light","seawall"],["seawall","refect"],["seawall","cliff"],["cliff","docks"],["docks","river","lantern"],["kitchen","cellar"],["cellar","vault"],["vault","river","lantern"],["river","cata","key"],["vane","cr_wolves","house:wolves"],["bell","cr_herons","house:herons"],["doors","cr_foxes","house:foxes"],["yard","cr_bears","house:bears"],["moon","lake"],["lib","warden",null,"bookcase"],["cellar","cliff",null,"tunnel"],["orchard","thorn"],["thorn","hollow"]];
const ITEMS={lantern:"loose lantern",key:"brass key",seal:"frost seal"};
function canOpen(l){return l.startsWith("house:")?S.house===l.slice(6):S.items.includes(l)}
function lockMsg(l){return l.startsWith("house:")?"This door only opens for the "+HOUSES[l.slice(6)].n+".":LOCKMSG[l]}
const LOCKMSG={lantern:"Pitch black. You need a light to go further.",key:"An iron gate with a brass lock.",seal:"A door frozen solid. Something colder than ice might open it."};
const HOUSES={
  wolves:{n:"Wolves",c:"#8796C4",hex:0x4d5b85,line:"A low howl rises off the page. The pack has claimed you."},
  herons:{n:"Herons",c:"#5FB8B0",hex:0x2b7470,line:"Paper wings unfold from the page and settle on your shoulder."},
  foxes:{n:"Foxes",c:"#E07D45",hex:0xa04a22,line:"A russet tail flicks across the page and vanishes into the margin."},
  bears:{n:"Bears",c:"#C4985A",hex:0x6b4c2a,line:"The book thumps shut, heavy as a paw, then falls open on your name."}
};
const HK=Object.keys(HOUSES);
const SPELLS={
  spark:{n:"Spark",cd:.45,dmg:9,spd:32,col:0xfff1a0,type:"bolt",size:.16},
  ward:{n:"Ward",cd:8,type:"self",dur:3},
  ember:{n:"Ember",cd:1.5,dmg:22,spd:22,col:0xff6a2a,type:"bolt",size:.3},
  mend:{n:"Mend",cd:10,type:"self",heal:35},
  gust:{n:"Gust",cd:4,dmg:7,spd:28,col:0xd8f5e6,type:"bolt",size:.26,push:7},
  frost:{n:"Frost bind",cd:6,dmg:5,spd:24,col:0x9fe3ff,type:"bolt",size:.22,freeze:2.5}
};
const ORDER=["spark","ward","ember","mend","gust","frost"];
const ROMAN=["","","II","III","IV","V","VI","VII","VIII","IX","X","XI","XII","XIII","XIV","XV","XVI","XVII","XVIII","XIX","XX"],MAXLV=20;
function SPX(id,lv=1){lv=Math.max(1,Math.min(MAXLV,lv|0));const b=SPELLS[id],o=Object.assign({},b,{lv,n:b.n+(lv>1?" "+ROMAN[lv]:"")}),k=lv-1;
  if(id==="spark"){o.dmg=9+k*1.2;o.cd=Math.max(.2,.45-k*.016);o.spd=32+k*1.5;if(lv>=2)o.spread=lv>=11?7:lv>=6?5:3}
  else if(id==="ward"){o.dur=3+k*.35;o.cd=Math.max(3,8-k*.33);if(lv>=2)o.reflect=1;o.hits=lv>=12?3:lv>=5?2:1;o.rboost=lv>=16?4:lv>=8?2:0}
  else if(id==="ember"){o.dmg=22+k*2.5;if(lv>=2){o.splash=Math.min(6.5,3.5+(lv-2)*.25);o.splashDmg=14+(lv-2)*1.5;o.size=.36}}
  else if(id==="mend"){o.heal=35+k*5;o.cd=Math.max(4,10-k*.33);if(lv>=2)o.hot=6+lv;if(lv>=12)o.cleanse=1}
  else if(id==="gust"){o.dmg=7+k*1.3;o.push=Math.min(14,7+k*.6);if(lv>=2){o.stun=1.5+(lv-2)*.15;o.size=.32}if(lv>=12)o.wide=3}
  else if(id==="frost"){o.dmg=5+k;o.freeze=Math.min(7,2.5+k*.3);if(lv>=6)o.aoe=lv>=14?4.5:3}
  return o}
function descFor(id,lv){const o=SPX(id,lv),r=x=>Math.round(x*10)/10;switch(id){
  case"spark":return r(o.dmg)+" damage per bolt"+(o.spread?", "+o.spread+" bolts at once":"");
  case"ward":return"blocks "+o.hits+" hit"+(o.hits>1?"s":"")+" for "+r(o.dur)+"s"+(o.reflect?" and throws spells back"+(o.rboost?" "+o.rboost+" levels stronger":""):"");
  case"ember":return r(o.dmg)+" damage"+(o.splash?", explodes for "+r(o.splashDmg)+" within "+r(o.splash)+"m":"");

  case"gust":return r(o.dmg)+" damage, "+r(o.push)+"m knockback"+(o.stun?", dazes for "+r(o.stun)+"s":"")+(o.wide?", also blasts anyone within 3m":"");

const CLASSES=[
  {h:9,s:"Wardcraft",room:"yard",prof:"Professor Brannock",spell:"ward",task:"Ward each of the three braziers. Aim at one and cast Ward."},
  {h:11,s:"Alchemy",room:"cellar",prof:"Professor Quillon",spell:"ember",task:"Light the three floating wicks with Ember."},
  {h:13,s:"Herb lore",room:"garden",prof:"Professor Fennimore",spell:"mend",task:"Aim at each wilted bloom and cast Mend."},
  {h:15,s:"Weather lore",room:"vane",prof:"Professor Gale",spell:"gust",task:"Scatter the three storm puffs with Gust."},
  {h:17,s:"Stillness",room:"clock",prof:"Professor Tenn",spell:"frost",task:"Freeze the three drifting gears with Frost bind."}

function blocked(x,z,r){for(const c of COL){if(c.off)continue;if(x+r>c.x0&&x-r<c.x1&&z+r>c.z0&&z-r<c.z1)return true}return false}
function moveC(o,dx,dz,r=.35){if(!blocked(o.x+dx,o.z,r))o.x+=dx;if(!blocked(o.x,o.z+dz,r))o.z+=dz}
function pushC(o,ux,uz,dist){const reg=roomAt(o.x,o.z)||corrAt(o.x,o.z);const inside=(x,z)=>!reg?true:typeof reg==="string"?(Math.abs(x-X(reg))<=half(reg)-.4&&Math.abs(z-Z(reg))<=half(reg)-.4):(x>=reg.r.x0&&x<=reg.r.x1&&z>=reg.r.z0&&z<=reg.r.z1);
  const n=Math.ceil(dist/.25),sx=ux*dist/n,sz=uz*dist/n;for(let i=0;i<n;i++){const px=o.x,pz=o.z;moveC(o,sx,sz);if(!inside(o.x,o.z)){o.x=px;o.z=pz;break}}}
function guard(o){if(roomAt(o.x,o.z)||corrAt(o.x,o.z)){o.sx=o.x;o.sz=o.z}else if(o.sx!==undefined){o.x=o.sx;o.z=o.sz}}
function wallHit(x,z){for(const c of COL){if(c.off||c.h<1.5)continue;if(x>c.x0&&x<c.x1&&z>c.z0&&z<c.z1)return true}return false}
function los(ax,az,bx,bz){const d=Math.hypot(bx-ax,bz-az),n=Math.ceil(d/.7);for(let i=1;i<n;i++){if(wallHit(ax+(bx-ax)*i/n,az+(bz-az)*i/n))return false}return true}
// aim
let offX=0,offY=0;
function aimDir(){if(mouse.on&&!coarse){const wx=(mouse.sx+offX)/PPM,wz=(mouse.sy+offY)/PPM;const dx=wx-P.x,dz=wz-(P.z-.9),l=Math.hypot(dx,dz)||1;return[dx/l,dz/l]}
  let tgt=null,bd=16;if(lesson){lesson.orbs.forEach(o=>{if(!o.hit){const d=Math.hypot(o.x-P.x,o.z-P.z);if(d<bd){bd=d;tgt=o}}})}
  if(!tgt)NPCS.forEach(n=>{if(n.state==="down"||n.staff||(n.h===S.house&&n.state!=="duel"))return;const d=Math.hypot(n.x-P.x,n.z-P.z)*(n.state==="duel"?.5:1);if(d<bd&&los(P.x,P.z,n.x,n.z)){bd=d;tgt=n}});
  if(tgt){const dx=tgt.x-P.x,dz=tgt.z-P.z,l=Math.hypot(dx,dz)||1;return[dx/l,dz/l]}return[P.ax,P.az]}

  if(!S.house){toast(c.prof+": Get sorted first. The book is in the Foyer of echoes.");return}
  if(cur!==i){toast(c.prof+": "+c.s+" meets here at "+fmt(c.h*60)+(S.minute>=c.h*60+60?" tomorrow.":". Don't be late."));return}
  if(S.att.checked.includes(i)){toast(lesson&&lesson.idx===i?c.prof+": "+c.task:c.prof+": You've finished today's lesson. Well done.");return}

function startLesson(i){const c=CLASSES[i],cx=X(c.room),cz=Z(c.room),cur=plv(c.spell),adv=S.spells.includes(c.spell)&&cur<MAXLV&&lvMethod(c.spell)==="class",need=adv?Math.min(10,3+Math.ceil(cur/2)):3;const orbs=[];
  for(let k=0;k<need;k++){if(adv)orbs.push({orbit:1,cx,cz,r:rand(4,7.5),ph:k/need*Math.PI*2,s:rand(.35,.6)*(1+Math.min(cur,12)*.1)*(k%2?1:-1),x:cx,z:cz,hit:false});
    else{const[a,b]=[[-5,-5],[-5,5],[5,5]][k];orbs.push({orbit:0,x:cx+a+rand(-1,1),z:cz+b+rand(-1,1),hit:false})}}
  lesson={idx:i,spell:c.spell,orbs,hits:0,need,adv,col:hex(SPELLS[c.spell].col||0xffe1a0)};P.sel=c.spell;refreshBar();
  toast(adv?c.prof+": Advanced lesson. Hit all "+need+" moving targets to reach "+SPX(c.spell,cur+1).n+".":c.prof+": "+(S.spells.includes(c.spell)?"Practice day. ":"Today, "+SPELLS[c.spell].n+". ")+c.task)}
function lessonHit(dx,dz){if(!lesson||P.sel!==lesson.spell)return;for(const o of lesson.orbs){if(o.hit)continue;const vx=o.x-P.x,vz=(o.z-1.6)-(P.z-.9),t=vx*dx+vz*dz;if(t<0||t>30)continue;const px=vx-dx*t,pz=vz-dz*t;if(Math.hypot(px,pz)<1){o.hit=true;lesson.hits++;toast("Target "+lesson.hits+" of "+lesson.need);break}}
  if(lesson.hits>=lesson.need)finishLesson()}

  if(isNew){S.spells.push(c.spell);award(S.house,10,"learned "+SPELLS[c.spell].n);toast(c.prof+": Excellent. "+SPELLS[c.spell].n+" is yours now. Press "+(ORDER.indexOf(c.spell)+1)+" to use it."+" Some levels come from classes, others from using it.")}
  else if(adv){toast(c.prof+": Superb work.");levelUp(c.spell)}
  else award(S.house,5,"practiced "+SPX(c.spell,plv(c.spell)).n);refreshBar();save()}

// spells
const PROJ=[],FX=[];
function fire(owner,id,x,z,dx,dz,lv=1){const sp=SPX(id,lv);PROJ.push({owner,id,lv,x:x+dx*.6,z:z+dz*.6,vx:dx*sp.spd,vz:dz*sp.spd,life:2.4,col:hex(sp.col),r:sp.size})}
function reflect(owner,fx,fz,tx,tz,id,lv){const dx=tx-fx,dz=tz-fz,l=Math.hypot(dx,dz)||1;fire(owner,id,fx,fz,dx/l,dz/l,lv)}
let flashT=0;
function cast(){if(P.frozen>now){toast("You can't move your wand.");return}const id=P.sel;if(!known(id))return;const lv=S.spells.includes(id)?plv(id):1,sp=SPX(id,lv);if((P.cds[id]||0)>now)return;
  P.cds[id]=now+((lesson&&lesson.spell===id)?Math.min(sp.cd,1.2):sp.cd);flashT=.12;const[dx,dz]=aimDir();P.ax=dx;P.az=dz;if(!P.seated)P.dir=dirOf(dx,dz);
  if(sp.type==="bolt"){const ox=P.x,oz=P.z-.9;if(sp.spread){const h=(sp.spread-1)/2;for(let k=-h;k<=h;k++){const a=k*.07,c=Math.cos(a),s=Math.sin(a);fire("p",id,ox,oz,dx*c-dz*s,dx*s+dz*c,lv)}}else fire("p",id,ox,oz,dx,dz,lv)}
  else if(id==="ward"){P.ward=now+sp.dur;P.wardLv=lv;P.wardHits=sp.hits}else if(id==="mend"){if(100-P.hp>=10)gainXP("mend",1);P.hp=Math.min(100,P.hp+sp.heal);if(sp.hot)P.hot=now+5;if(sp.cleanse)P.frozen=0;FX.push({x:P.x,z:P.z-.8,t:0,r:1.6,col:"120,255,150"})}
  if(lesson)lessonHit(dx,dz)}
function hitNpc(n,id,vx,vz,lv=1){if(n.state==="down")return;if(n.staff){n.hitT=now+.15;if(S.house&&now>(n.scold||0)){n.scold=now+30;award(S.house,-5,"hexing the "+n.title.toLowerCase())}toast(n.nm+": Oi! Watch where you point that wand.");return}const sp=SPX(id,lv);
  if(n.ward>now){const w=SPX("ward",n.wardLv||1);n.wardHits=(n.wardHits||1)-1;if(n.wardHits<=0)n.ward=0;
    gainXP(id,.5);if(w.reflect){reflect(n,n.x,n.z-.9,P.x,P.z-.9,id,Math.min(MAXLV,lv+w.rboost));toast(n.nm+"'s "+w.n+" threw your "+sp.n+" back.")}else toast(n.nm+" blocked it with Ward.");startDuel(n,true);return}
  if(sp.freeze)n.frozen=now+sp.freeze;if(sp.aoe)NPCS.forEach(o=>{if(o!==n&&o.state!=="down"&&!o.staff&&Math.hypot(o.x-n.x,o.z-n.z)<sp.aoe){o.frozen=now+sp.freeze*.7;gainXP(id,.5);if(o.state!=="duel")startDuel(o,true)}});
  if(sp.stun)n.frozen=Math.max(n.frozen,now+sp.stun);if(sp.wide)NPCS.forEach(o=>{if(o!==n&&o.state!=="down"&&!o.staff){const dx=o.x-n.x,dz=o.z-n.z,dd=Math.hypot(dx,dz);if(dd<sp.wide){gainXP(id,.5);pushC(o,dx/(dd||1),dz/(dd||1),sp.push*.6);o.frozen=Math.max(o.frozen,now+(sp.stun||1));if(o.state!=="duel")startDuel(o,true)}}});
  if(sp.push){const l=Math.hypot(vx,vz)||1;pushC(n,vx/l,vz/l,sp.push)}n.castT=Math.max(n.castT,sp.push?1.2:0);
  if(dinnerOn()&&S.house&&roomAt(P.x,P.z)==="refect"&&!S.att.dinnerFight){S.att.dinnerFight=true;award(S.house,-10,"started a fight at dinner")}
  gainXP(id,1);
  hurtNpc(n,sp.dmg*(S.fedDay>=S.day?1.1:1),id)}
function hurtNpc(n,dmg,id){if(n.state==="down"||n.staff)return;n.hp-=dmg;n.hitT=now+.15;if(n.state!=="duel")startDuel(n,true);
  if(n.hp<=0){n.state="down";n.down=now+75;if(id)gainXP(id,3);
    if(S.house&&n.h!==S.house){award(S.house,15,"beat "+n.nm+" in a duel");S.points[n.h]=Math.max(0,S.points[n.h]-5);drawBoard();S.wins=(S.wins||0)+1;if(S.winBase==null)S.winBase=S.wins-1;
      if(plv("spark")<MAXLV&&lvMethod("spark")==="duels"&&S.wins-S.winBase>=2)levelUp("spark");refreshBar();save()}else toast("You beat "+n.nm+".")}}
function hitPlayer(id,n,lv=1){const sp=SPX(id,lv);if(P.ward>now){gainXP("ward",1);const w=SPX("ward",P.wardLv||1);P.wardHits=(P.wardHits||1)-1;if(P.wardHits<=0)P.ward=0;

  if(sp.freeze)P.frozen=now+sp.freeze*.6;if(sp.stun)P.frozen=Math.max(P.frozen,now+sp.stun*.6);if(sp.push){const l=Math.hypot(P.x-n.x,P.z-n.z)||1;pushC(P,(P.x-n.x)/l,(P.z-n.z)/l,sp.push)}}

  setTimeout(()=>{P.x=X("apoth")-6;P.z=Z("apoth")-3;P.hp=100;P.frozen=0;$("fade").style.opacity=0;modal=false;toast("You wake up in the apothecary.")},1400)}
function startDuel(n,byPlayer){if(n.state==="duel"||n.state==="down"||n.staff)return;if(n.seat){n.seat.taken=null;n.seat=null}n.seated=false;n.dinner=false;n.state="duel";n.castT=byPlayer?.6:1.3;n.path=[];

function challenge(){if(!S.house){toast("Get sorted before you start duels.");return}const[ax,az]=coarse?[0,0]:aimDir();let best=null,bd=99;
  NPCS.forEach(n=>{if(n.state==="down"||n.staff)return;const dx=n.x-P.x,dz=n.z-P.z,dist=Math.hypot(dx,dz);if(dist>12)return;const dot=coarse?1:(dx*ax+dz*az)/(dist||1);if(dot>.8&&dist<bd){bd=dist;best=n}});
  if(!best){toast(coarse?"No student close enough to challenge.":"Aim at a student nearby to challenge them.");return}

  for(let i=PROJ.length-1;i>=0;i--){const p=PROJ[i];p.x+=p.vx*dt;p.z+=p.vz*dt;p.life-=dt;let dead=p.life<=0||wallHit(p.x,p.z+.9),hitN=null;if(dead&&p.owner==="p"&&p.life>0){const ck=CRACKS.find(k=>!k.c.off&&Math.hypot(p.x-k.x,p.z+.9-k.z)<2.4);if(ck){foundSecret(ck.id,ck.id==="bookcase"?"A hidden passage between the Mirror library and the Warden's study.":"An old smugglers' tunnel from the Alchemy cellars to the Cliff stairs.",20);FX.push({x:ck.x,z:ck.z,t:0,r:2,col:"220,210,190"})}}
    if(!dead&&p.owner==="p"){for(const n of NPCS){if(n.state==="down")continue;if(Math.hypot(p.x-n.x,p.z-(n.z-.9))<.6){hitNpc(n,p.id,p.vx,p.vz,p.lv);hitN=n;dead=true;break}}}
    else if(!dead&&p.owner!=="p"&&Math.hypot(p.x-P.x,p.z-(P.z-.9))<.55){hitPlayer(p.id,p.owner,p.lv);hitN="player";dead=true}
    if(dead){if(p.owner==="p"&&!hitN){const dm=DUMMIES.find(([a,b])=>Math.hypot(p.x-a,p.z+.9-b)<1);if(dm){gainXP(p.id,.25);FX.push({x:dm[0],z:dm[1]-1,t:0,r:.8,col:"255,240,200"})}}if(SPX(p.id,p.lv).splash&&p.life>0)explode(p.x,p.z+.9,p,hitN);PROJ.splice(i,1)}}
  for(let i=FX.length-1;i>=0;i--){FX[i].t+=dt;if(FX[i].t>.3)FX.splice(i,1)}
  if(hurtT>0)hurtT-=dt}
function frame(){requestAnimationFrame(frame);const tn=performance.now(),dt=Math.min((tn-lastT)/1000,.05);lastT=tn;
  if(running&&!modal)update(dt);flashT-=dt;const t=tn/1000;render(t);updLabels();
  hudT-=dt;if(hudT<=0){hudT=.1;updHud()}if(running&&!modal){saveT-=dt;if(saveT<=0){saveT=5;S.hp=P.hp;save()}}}

// ================= START =================
if(S.att.day!==S.day)S.att={day:S.day,checked:[],ended:[],warned:[]};
S.secrets.forEach(id=>openSecretPath(id));syncLocks();drawBoard();buildBar();syncMini();startScreen();frame();
</script>
